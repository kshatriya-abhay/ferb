[tools]
java = "temurin-21"   # JDK for Gradle/AGP
gradle = "9.8.0"      # only used to bootstrap the wrapper; builds use ./gradlew

[env]
# Android Studio's SDK on Linux unless ANDROID_HOME says otherwise (macOS: ~/Library/Android/sdk).
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk') }}"
_.path = [
  "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk') }}/cmdline-tools/latest/bin",
  "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk') }}/platform-tools",
]

[tasks.bootstrap]
description = "Generate local.properties (the Gradle wrapper is committed)"
run = "echo \"sdk.dir=$ANDROID_HOME\" > local.properties"

[tasks.fetch]
description = "Download the Needle engine and the Needle 3 and Whistle models the app bundles (pinned, SHA-256 checked)"
# bash, not sh: Ubuntu's sh (dash, as on CI) has no pipefail
shell = "bash -c"
run = '''
set -euo pipefail
NEEDLE=https://huggingface.co/Cactus-Compute/needle3/resolve/c7c415a3d1b3d929014bc6e866d51ebb971f7089
fetch() { # url path sha256
  if [ -f "$2" ] && echo "$3  $2" | sha256sum -c --quiet 2>/dev/null; then return; fi
  mkdir -p "$(dirname "$2")"
  curl -fL --progress-bar -o "$2.part" "$1"
  echo "$3  $2.part" | sha256sum -c --quiet
  mv "$2.part" "$2"
}
fetch $NEEDLE/android-arm64/libneedle.a third_party/needle/android-arm64/libneedle.a 16752fb75adea7af89bbc435a97d1cda7e71bc74d04578d551d0d3bbd5f9e633
fetch $NEEDLE/android-arm64/needle.h third_party/needle/android-arm64/needle.h 90f347f9dca1199de79967ab199a56e0588bd473fe306051f8d80d146976a324
fetch $NEEDLE/needle3.cact app/src/main/assets/needle3.cact c9d915eca282ed42d1a09b143b592adb4cc6744ffe2d294adf5cfc5548170c38
# Whistle, Cactus's speech model for Phone-mode voice, on the same engine. Later commits only change the card.
fetch https://huggingface.co/Cactus-Compute/whistle/resolve/b358ddadd89b7a713b5aa131f23032d3cca1b251/whistle.cact app/src/main/assets/whistle.cact b6e02f048568ac5d01a2042556c658061e699acbc0aa2a1439f52f3d461dffeb
echo "All files present and verified."
'''

[tasks.tool-check-engine]
description = "Fetch Cactus's Linux build of the Needle engine and build tool-check's runner (for tool-check and bench)"
hide = true
# bash, not sh: Ubuntu's sh (dash, as on CI) has no pipefail
shell = "bash -c"
run = """
set -euo pipefail
NEEDLE=https://huggingface.co/Cactus-Compute/needle3/resolve/c7c415a3d1b3d929014bc6e866d51ebb971f7089
DIR=build/tool-check
mkdir -p "$DIR"
fetch() { # url path sha256
  if [ -f "$2" ] && echo "$3  $2" | sha256sum -c --quiet 2>/dev/null; then return; fi
  curl -fsL -o "$2.part" "$1"
  echo "$3  $2.part" | sha256sum -c --quiet
  mv "$2.part" "$2"
}
# Cactus's Linux build of the same engine. It's built against LLVM's libc++, which Zig bundles.
fetch $NEEDLE/linux-x86_64/libneedle.a "$DIR/libneedle.a" 5c0ff309dcf9c2238bd07986d9d100069d568596c2378f0bfedc1677cc02f756
fetch $NEEDLE/linux-x86_64/needle.h "$DIR/needle.h" 90f347f9dca1199de79967ab199a56e0588bd473fe306051f8d80d146976a324
if [ ! -x "$DIR/tool_check" ] || [ tool-check/tool_check.cpp -nt "$DIR/tool_check" ]; then
  uvx --from ziglang python -m ziglang c++ -O2 -std=c++17 -w -I "$DIR" tool-check/tool_check.cpp "$DIR/libneedle.a" -lpthread -o "$DIR/tool_check"
fi
"""

[tasks.bench]
description = "Compare local models with Needle 3 on tool-check/requests.txt plus suite.txt: mise run bench [model|all] [all|default] [routed|unrouted]"
usage = '''
arg "[model]" help="needle3, needle3-2026-10-10 (a newer engine), a name in tool-check/models.txt (run through llama.cpp on the desktop), or all: every one, then a table" default="all"
arg "[set]" help="Which tools: all (default) or default" default="all"
arg "[mode]" help="routed (as the app does) or unrouted (every tool for every request)" default="routed"
'''
depends = ["tool-check-engine"]
# bash, not sh: Ubuntu's sh (dash, as on CI) has no pipefail
shell = "bash -c"
run = """
set -euo pipefail
DIR=build/bench
mkdir -p "$DIR/models" "$DIR/results"
# One bench at a time: models run side by side share the CPU and memory, which skews every
# timing and can push the machine into swap.
exec 9> "$DIR/.lock"
flock -n 9 || { echo "Another bench is running; wait for it (models must run one at a time)."; exit 1; }
# Nor beside Ferb Link's model server (ferb-llama, /data/Projects/ferb-link): it stays up, and a
# request from the phone loads Gemma 4 even while it sleeps.
if systemctl --user -q is-active ferb-llama 2>/dev/null; then
  echo "Ferb Link's model server is up: stop it first (mise run server:stop in ../ferb-link)."; exit 1
fi
fetch() { # url path sha256
  if [ -f "$2" ] && echo "$3  $2" | sha256sum -c --quiet 2>/dev/null; then return; fi
  curl -fL --progress-bar -o "$2.part" "$1"
  echo "$3  $2.part" | sha256sum -c --quiet
  mv "$2.part" "$2"
}
./gradlew --no-daemon -q testDebugUnitTest --tests '*ToolSchemasTest*'
cat tool-check/requests.txt tool-check/suite.txt > "$DIR/requests.txt"
# Needle 3 doesn't understand Hindi: its runs skip the @hi sections, which the other models keep.
python3 tool-check/lines.py --skip hi tool-check/requests.txt tool-check/suite.txt > "$DIR/requests-no-hi.txt"
TOOLS="app/build/tool-check/${usage_set}.json"
# Answers are kept per model in tool-check/results/ (route.Cache): only requests and tool sets not
# answered before are run.
# Needle 3 with a newer engine: the same needle3.cact (unchanged since), Cactus's 2026-10-10
# production build of libneedle (rev 93e88ed), which the app doesn't use yet.
NEWER=build/bench/needle-93e88ed
newer_engine() {
  mkdir -p "$NEWER"
  local REV=https://huggingface.co/Cactus-Compute/needle3/resolve/93e88ede867e4311c39151285e74df513e4b835b/linux-x86_64
  fetch $REV/libneedle.a "$NEWER/libneedle.a" 5f8ed375f304cf7e7ba9e6e37d105b51549597e014afbd006407a0836804e5cd
  fetch $REV/needle.h "$NEWER/needle.h" a27dac4b3239eead91d124b7f7dbce5495c13019903fd817b68c16d39b055a99
  if [ ! -x "$NEWER/tool_check" ] || [ tool-check/tool_check.cpp -nt "$NEWER/tool_check" ]; then
    uvx --from ziglang python -m ziglang c++ -O2 -std=c++17 -w -I "$NEWER" tool-check/tool_check.cpp "$NEWER/libneedle.a" -lpthread -o "$NEWER/tool_check"
  fi
}
MODELS="needle3 needle3-2026-10-10 $(grep -v '^#' tool-check/models.txt | cut -d' ' -f1)"
bench() { # model
  local OUT="$DIR/results/$1-${usage_set}-${usage_mode}"
  local REQUESTS="$DIR/requests.txt"
  case "$1" in needle3*) REQUESTS="$DIR/requests-no-hi.txt" ;; esac
  if [ "$1" = needle3-2026-10-10 ]; then
    newer_engine
    BENCH_CACHE="tool-check/results/$1.jsonl" BENCH_SALT=c9d915eca282ed42d1a09b143b592adb4cc6744ffe2d294adf5cfc5548170c38/5f8ed375f304cf7e7ba9e6e37d105b51549597e014afbd006407a0836804e5cd \
      python3 tool-check/route.py "$NEWER/tool_check" app/src/main/assets/needle3.cact "$TOOLS" "$REQUESTS" \
      app/build/tool-check/cues.json "$usage_mode" > "$OUT.answers"
  elif [ "$1" = needle3 ]; then
    BENCH_CACHE="tool-check/results/needle3.jsonl" BENCH_SALT=c9d915eca282ed42d1a09b143b592adb4cc6744ffe2d294adf5cfc5548170c38 \
      python3 tool-check/route.py build/tool-check/tool_check app/src/main/assets/needle3.cact "$TOOLS" "$REQUESTS" \
      app/build/tool-check/cues.json "$usage_mode" > "$OUT.answers"
  else
    read -r _ REPO REV FILE SHA < <(grep "^$1 " tool-check/models.txt) || { echo "No model $1 in tool-check/models.txt"; exit 1; }
    # llama.cpp's CPU build for Linux, pinned.
    fetch https://github.com/ggml-org/llama.cpp/releases/download/b11541/llama-b11541-bin-ubuntu-x64.tar.gz "$DIR/llama.tar.gz" 36ca310be4405acb7ba59b32dbdce32bb9cd7b1ef95358997b7eaed2c6f0188b
    [ -x "$DIR/llama/llama-b11541/llama-server" ] || { mkdir -p "$DIR/llama"; tar -xzf "$DIR/llama.tar.gz" -C "$DIR/llama"; }
    fetch "https://huggingface.co/$REPO/resolve/$REV/$FILE" "$DIR/models/$FILE" "$SHA"
    BENCH_CACHE="tool-check/results/$1.jsonl" BENCH_SALT="$SHA" \
      python3 tool-check/bench.py "$DIR/llama/llama-b11541/llama-server" "$DIR/models/$FILE" "$TOOLS" "$DIR/requests.txt" \
      app/build/tool-check/cues.json "$usage_mode" > "$OUT.answers"
  fi
  python3 tool-check/score.py "$TOOLS" "$REQUESTS" app/build/tool-check/bars.json app/build/tool-check/cues.json < "$OUT.answers" > "$OUT.txt"
}
if [ "$usage_model" = all ]; then
  for m in $MODELS; do echo "== $m"; bench "$m"; done
  python3 tool-check/compare.py $(for m in $MODELS; do echo "$DIR/results/$m-${usage_set}-${usage_mode}.txt"; done) \
    | tee "tool-check/results/summary-${usage_set}-${usage_mode}.txt"
else
  bench "$usage_model"
  cat "$DIR/results/${usage_model}-${usage_set}-${usage_mode}.txt"
fi
"""

[tasks.tool-check]
description = "Run Needle 3 on the desktop with the app's tools against tool-check/requests.txt: mise run tool-check [all|default] [routed|fallback|unrouted]"
usage = '''
arg "[set]" help="Which tools: all (default) or default (the ones on by default)" default="all"
arg "[mode]" help="routed: only the tools a request mentions, as the app does; fallback: also every tool when those give no call; unrouted: every tool for every request" default="routed"
'''
depends = ["tool-check-engine"]
# bash, not sh: Ubuntu's sh (dash, as on CI) has no pipefail
shell = "bash -c"
run = """
set -euo pipefail
DIR=build/tool-check
./gradlew --no-daemon -q testDebugUnitTest --tests '*ToolSchemasTest*'
# Needle 3 doesn't understand Hindi: the @hi section is for the computer's model only.
python3 tool-check/lines.py --skip hi tool-check/requests.txt > "$DIR/requests.txt"
if [ "$usage_mode" = unrouted ]; then
  TOOL_CHECK_RAW=1 "$DIR/tool_check" app/src/main/assets/needle3.cact "app/build/tool-check/${usage_set}.json" "$DIR/requests.txt" ${FACTS:+"$FACTS"} \
    > "app/build/tool-check/${usage_set}.answers"
else
  python3 tool-check/route.py "$DIR/tool_check" app/src/main/assets/needle3.cact "app/build/tool-check/${usage_set}.json" "$DIR/requests.txt" \
    app/build/tool-check/cues.json "$usage_mode" > "app/build/tool-check/${usage_set}.answers"
fi
python3 tool-check/score.py "app/build/tool-check/${usage_set}.json" "$DIR/requests.txt" app/build/tool-check/bars.json app/build/tool-check/cues.json \
  < "app/build/tool-check/${usage_set}.answers"
"""

[tasks.check-offline]
description = "Fail if the built APK can use the network: an INTERNET permission, or networking calls in its native code"
depends = ["build"]
run = "scripts/check-offline.sh"

[tasks.release]
description = "Build, sign (with the release key, asked for or from FERB_RELEASE_* variables), check and write dist/ferb-<version>.apk; see docs/development.md"
depends = ["fetch"]
run = "scripts/release.sh"

[tasks.smoke]
description = "Build the release build (R8) as its own app, dev.abhay.assistant.smoke, signed with the debug key, and check it's offline; for the smoke test (docs/development.md)"
depends = ["fetch"]
shell = "bash -c"
run = """
./gradlew --no-daemon -q :app:assembleSmoke
scripts/check-offline.sh app/build/outputs/apk/smoke/app-smoke.apk
echo "Built app/build/outputs/apk/smoke/app-smoke.apk"
"""

[tasks."release:publish"]
description = "Publish dist/ferb-<version>.apk as a GitHub release (the maintainer only, at a terminal)"
run = "scripts/publish.sh"

[tasks.build]
description = "Build the debug APK"
depends = ["fetch"]
run = "./gradlew --no-daemon assembleDebug"

[tasks.test]
description = "Unit and contract tests: fast, no model, server or phone (see README, Testing)"
run = "./gradlew --no-daemon testDebugUnitTest"

[tasks."link:contract-check"]
description = "Check Ferb's copy of Ferb Link's contract fixtures against ../ferb-link (or $FERB_LINK); skipped without it"
# bash, not sh: Ubuntu's sh (dash, as on CI) has no pipefail
shell = "bash -c"
run = """
set -euo pipefail
SRC="${FERB_LINK:-../ferb-link}/contract/v1"
DST=app/src/test/resources/ferb-link-contract/v1
if [ ! -d "$SRC" ]; then echo "skipped: no $SRC"; exit 0; fi
if diff -r -q -x SOURCE "$SRC" "$DST"; then echo "Ferb's copy matches $SRC"; else echo "out of date: mise run link:contract-sync"; exit 1; fi
"""

[tasks."link:contract-sync"]
description = "Copy Ferb Link's contract fixtures from ../ferb-link (or $FERB_LINK) into Ferb's tests, with the commit they came from"
# bash, not sh: Ubuntu's sh (dash, as on CI) has no pipefail
shell = "bash -c"
run = """
set -euo pipefail
ROOT="${FERB_LINK:-../ferb-link}"
DST=app/src/test/resources/ferb-link-contract/v1
rm -rf "$DST" && mkdir -p "$DST"
cp -r "$ROOT/contract/v1/." "$DST/"
git -C "$ROOT" log -1 --format='%h %cs %s' -- contract > "$DST/SOURCE"
echo "Copied $(ls "$DST" | grep -c json) fixtures from $(cat "$DST/SOURCE")"
"""

[tasks.device-test]
description = "Run the device tests on the connected phone (am instrument; never connectedAndroidTest)"
depends = ["fetch"]
# Never connected*AndroidTest: it uninstalls the app when it's done, wiping the user's reminders,
# settings and grants (2026-10-29: it wiped Ferb Link's pairing). device-check.sh installs with
# -r and runs am instrument against the installed APKs.
run = "scripts/device-check.sh"

[tasks.install]
depends = ["fetch"]
run = "./gradlew --no-daemon installDebug"

[tasks.run]
description = "Install and launch on the connected phone"
depends = ["install"]
run = "adb shell am start -n dev.abhay.assistant/.MainActivity"

[tasks.send-over-tailscale]
description = "Build the debug APK and send it to a device with Taildrop: mise run send-over-tailscale <device>"
usage = 'arg "<device>" help="The Tailscale device to send to, e.g. my-phone"'
depends = ["build"]
# bash, not sh: Ubuntu's sh (dash, as on CI) has no pipefail
shell = "bash -c"
run = """
set -euo pipefail
# Always the same name. Tailscale on Android never overwrites: a repeat send arrives as
# Ferb-<uuid>.apk, so old copies have to be deleted on the phone.
cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Ferb.apk
tailscale file cp app/build/outputs/apk/debug/Ferb.apk "${usage_device}:"
echo "Sent Ferb.apk ($(git rev-parse --short HEAD)) to ${usage_device}"
"""
