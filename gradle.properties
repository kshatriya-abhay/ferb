org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Device tests (connectedDebugAndroidTest) normally uninstall the app afterwards, which also
# deletes its saved settings; keep it installed instead.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# Compile Kotlin inside the build, not in a Kotlin daemon that outlives it: builds run with
# --no-daemon, so nothing stays to push Ferb Link's model (on the same laptop) out of memory.
kotlin.compiler.execution.strategy=in-process
